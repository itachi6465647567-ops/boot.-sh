name: Build Titan OS ISO

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Tools and Run boot.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso squashfs-tools isolinux syslinux-utils
          chmod +x boot.sh
          sudo bash boot.sh

      - name: Find and Move ISO File
        run: |
          mkdir -p ~/iso-output
          find / -name "*.iso" -not -path "/proc/*" -not -path "/sys/*" -exec cp {} ~/iso-output/ \; 2>/dev/null || true
          ls -la ~/iso-output/

      - name: Upload Titan OS ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Titan-OS-ISO
          path: ~/iso-output/*.iso
          if-no-files-found: warn
