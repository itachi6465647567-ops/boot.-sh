name: Build Titan OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment and Build Titan OS ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso squashfs-tools isolinux syslinux-utils
          
          # boot.sh ஃபைலுக்கு அனுமதி கொடுத்து இயக்கவும்
          chmod +x boot.sh
          sudo bash boot.sh

      - name: Check ISO File
        run: |
          ls -la ~/Desktop/ || true
          ls -la *.iso || true

      - name: Upload Titan OS ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Titan-OS-64bit-ISO
          path: |
            ~/Desktop/*.iso
            *.iso
          if-no-files-found: warn
