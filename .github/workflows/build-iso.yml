name: Build Titan OS ISO

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and Run Build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso squashfs-tools isolinux syslinux-utils
          chmod +x boot.sh
          sudo bash boot.sh

      - name: Upload Titan OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: Titan-OS-ISO
          path: |
            ~/Desktop/*.iso
            *.iso
          if-no-files-found: warn
